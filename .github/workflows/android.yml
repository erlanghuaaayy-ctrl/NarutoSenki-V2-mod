# Simpan sebagai: .github/workflows/android.yml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # sdkmanager butuh Java 11+, jadi dijalankan SEBELUM setup Java 8
      - name: Pasang SDK + NDK r21e
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-31" "build-tools;31.0.0" "ndk;21.4.7075529"

      # Gradle 5.6.4 + Android Gradle Plugin 3.3.3 (proyek lama) butuh Java 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NarutoSenki-apk
          path: projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/**/*.apk
